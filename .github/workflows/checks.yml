name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Logic checks
        run: dotnet run --project tests/BindingChecks -c Release
      - name: Pack
        run: dotnet pack NuclearOption.Bindings.csproj -c Release -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: artifacts/*.nupkg
